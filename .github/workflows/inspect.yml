name: Inspect UI
on:
  push:
    branches: [ui-next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Prepare inspection signing config
        run: |
          keytool -genkeypair -keystore keystore.jks -storepass inspection -keypass inspection -alias inspection -keyalg RSA -validity 2 -dname CN=Inspection
          printf 'KEYSTORE_FILE=../keystore.jks\nKEYSTORE_PASSWORD=inspection\nKEY_ALIAS=inspection\nKEY_PASSWORD=inspection\n' > signing.properties
      - name: Compile UI inspection build
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PuiInspection=true --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/DFRoot_*.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w df.root.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-result.txt
            adb logcat -d -s AndroidRuntime
            mkdir -p inspection
            adb pull /sdcard/Android/data/df.root/files/Pictures inspection/screens
      - name: Encrypt inspection output
        env:
          ARTIFACT_PASSWORD: ${{ secrets.TEST_ARTIFACT_PASSWORD }}
        run: |
          tar czf inspection.tgz inspection
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in inspection.tgz -out inspection.tgz.enc -pass env:ARTIFACT_PASSWORD
      - uses: actions/upload-artifact@v7
        with:
          name: UI-inspection-encrypted
          path: inspection.tgz.enc
          retention-days: 7
      - name: Require passing instrumentation
        run: grep -q 'OK (2 tests)' instrument-result.txt
